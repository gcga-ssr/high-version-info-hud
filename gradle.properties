# 注意：不要再强制 -Dhttps.protocols=TLSv1.2。libraries.minecraft.net 等仓库现在要求
# TLS 1.3，强制 1.2 会导致 "Remote host terminated the handshake"。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
# 本地代理首次取大构件（fastutil/guava/log4j 等十几 MB）时上游可能超过默认 30s，
# 把 Gradle 的 HTTP 超时放宽，避免 Read timed out。
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=180000
# 16 个子工程各自要跑 NeoForm 流水线，串行更稳（内存/解压目录都更可控）
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- 所有版本共用 ----
mod_id=blockinfo
mod_name=Block Info
mod_license=MIT
mod_version=1.1.0
mod_group_id=com.example.blockinfo
loader_version_range=[1,)

# ---- 本机 HTTP 代理 ----
# 走本地 7897 端口的代理加速下载。
# 注意 nonProxyHosts 里的 127.0.0.1：.buildtools/nf_proxy.py 提供的是**本地直连**缓存代理
# （maven.neoforged.net / libraries.minecraft.net 的 JVM TLS 握手会被重置，只能由它中转），
# 这两个地址必须绕过系统代理，否则请求会绕一圈再回到自己。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=*.aliyun.com|localhost|127.0.0.1
systemProp.https.nonProxyHosts=*.aliyun.com|localhost|127.0.0.1
org.gradle.java.installations.paths=C:\\Users\\Administrator\\.jdks\\temurin-21,C:\\Users\\Administrator\\.jdks\\temurin-25

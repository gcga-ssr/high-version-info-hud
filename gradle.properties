org.gradle.jvmargs=-Xmx2G -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- 目标版本 ----
# 只针对 Minecraft 1.21.1 / NeoForge 21.1.x 线。
minecraft_version=1.21.1
# [1.21.1,1.21.2) 接受 1.21.1 及任何 1.21.1.x 补丁串，但不会放进 1.21.2+
minecraft_version_range=[1.21.1,1.21.2)
# 编译基线取整条 21.1.x 线的最低版本（21.1.0 不存在，首个发布就是 21.1.1），
# 这样产物只可能引用 21.1.1 已有的 API，从 21.1.1 到 21.1.264 都能加载。
neo_version=21.1.1
neo_version_range=[21.1.1,)
loader_version_range=[1,)

# ---- 模组元数据 ----
mod_id=blockinfo
mod_name=Block Info
mod_license=MIT
# 保持 1.5.0：jar 名与旧版一致，直接覆盖 mods/ 里的旧文件，避免两个同 modId 的 jar
mod_version=1.5.0
mod_group_id=com.example.blockinfo

# 代理对 Gradle(JVM) 的 TLS 连接偶发重置，直连 CDN 更稳定，故默认关闭（需要时可取消注释）
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7897
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=*.aliyun.com|localhost|127.0.0.1
systemProp.https.nonProxyHosts=*.aliyun.com|localhost|127.0.0.1

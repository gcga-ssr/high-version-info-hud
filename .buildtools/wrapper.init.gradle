// The wrapper task HEAD-tests its distributionUrl. services.gradle.org serves the
// index here but the CDN that hosts the .zip is unreachable from this JVM, so the
// test fails even though the distribution is already unpacked in
// ~/.gradle/wrapper/dists/gradle-8.9-bin/<hash>/ and needs no download.
// Disabling only that validation keeps the generated wrapper files standard.

allprojects {
    tasks.withType(org.gradle.api.tasks.wrapper.Wrapper).configureEach {
        validateDistributionUrl = false
    }
}
